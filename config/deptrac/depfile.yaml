# Deptrac — DDD project on Symfony
#
# Implements deterministic verification of architectural rules from docs/conventions/.
#
# Namespace pattern: {ProjectName}\{AppGroup}\Module\{ModuleName}\{Layer}\...
# Where:
#   {ProjectName}  — корневой namespace проекта (опционально, зависит от PSR-4 маппинга)
#   {AppGroup} — Common (разделяемый код) или имя приложения (Web, Api, Console, Blog)
#
# See README.md for layer descriptions and dependency rules.

deptrac:
  paths:
    - ./src
    - ./apps

  exclude_files:
    - '#.*tests.*#'

  layers:
    # --- Main layers ---

    - name: Domain
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Domain\\.*
          must_not:
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Domain\\ValueObject\\.*Vo$
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Domain\\Entity\\ValueObject\\.*Vo$
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Domain\\(Service|Repository|Strategy|Provider|Criteria|Helper)\\(?!\S*Model$).*
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Domain\\Specification\\.*
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Domain\\Enum\\.*
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Domain\\.*Dto$

    - name: Application
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Application\\.*
          must_not:
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Application\\.*Dto$
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Application\\Enum\\.*
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Application\\UseCase\\Command\\.*\\.*Command$
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Application\\UseCase\\Command\\.*\\.*CommandHandler$
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Application\\UseCase\\Query\\.*\\.*Query$
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Application\\UseCase\\Query\\.*\\.*QueryHandler$

    - name: IntegrationListener
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Integration\\Listener\\.*

    - name: Infrastructure
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Infrastructure\\(?!Model|Listener).*$
          must_not:
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Infrastructure\\.*Dto$
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Infrastructure\\Component\\.*
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Infrastructure\\Enum\\.*

    - name: InfrastructureComponent
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Infrastructure\\Component\\.*(Component|ComponentInterface)$

    - name: Integration
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Integration\\.*
          must_not:
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Integration\\Listener\\.*
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Integration\\.*Dto$

    - name: Presentation
      collectors:
        # Matches app-level namespaces (Console, Api, Web, etc.)
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?(?:Api|Console|Web|Blog|Docs)(?:\\v\d+)?\\Module\\.*

    # --- Fine-grained: DTO, VO, Enum ---

    - name: DomainSpecification
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Domain\\Specification\\.*

    - name: DomainVo
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Domain\\ValueObject\\.*Vo$

    # Domain contracts and pure value types (service/repository interfaces, find criteria,
    # helpers, strategies) — everything under Domain\{Service,Repository,…} except entities
    # (*Model): the only part of Domain the Application layer may use directly.
    - name: DomainContract
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Domain\\(Service|Repository|Strategy|Provider|Criteria|Helper)\\(?!\S*Model$).*

    # Embeddable VO are a persistence part of entities: isolated like Domain (entities),
    # not shared like DomainVo. See docs/conventions/layers/domain/entity.md.
    - name: DomainEmbeddable
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Domain\\Entity\\ValueObject\\.*Vo$

    - name: DomainEnum
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Domain\\Enum\\.*

    - name: DomainDto
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Domain\\.*Dto$

    - name: ApplicationDto
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Application\\.*Dto$

    - name: ApplicationEnum
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Application\\Enum\\.*

    - name: ApplicationCommonDto
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Application\\Dto\\.*Dto$

    - name: IntegrationDto
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Integration\\.*Dto$

    - name: InfrastructureDto
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Infrastructure\\.*Dto$

    - name: InfrastructureEnum
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Infrastructure\\Enum\\.*

    # --- CQRS artifacts ---

    - name: ApplicationCommand
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Application\\UseCase\\Command\\.*\\.*Command$

    - name: ApplicationCommandHandler
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Application\\UseCase\\Command\\.*\\.*CommandHandler$

    - name: ApplicationQuery
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Application\\UseCase\\Query\\.*\\.*Query$

    - name: ApplicationQueryHandler
      collectors:
        - type: classLike
          value: ^(?:[A-Za-z_][A-Za-z0-9_]*\\)?Common\\Module\\[^\\]+\\Application\\UseCase\\Query\\.*\\.*QueryHandler$

  ruleset:
    # DTO boundary
    Domain:
      - Domain
      - DomainContract
      - DomainDto
      - DomainEnum
      - DomainSpecification
      - DomainVo
      - DomainEmbeddable
    DomainVo:
      - Domain
      - DomainEnum
      - DomainVo

    DomainEmbeddable:
      - DomainEnum

    DomainContract:
      - Domain
      - DomainContract
      - DomainDto
      - DomainEnum
      - DomainSpecification
      - DomainVo
    DomainEnum:
      - DomainEnum
    ApplicationDto:
      - ApplicationDto
      - ApplicationCommonDto
      - ApplicationEnum
    ApplicationCommonDto:
      - ApplicationCommonDto
    IntegrationDto:
      - Integration
      - IntegrationDto
    InfrastructureDto:
      - Domain
      - DomainContract
      - DomainDto
      - DomainEnum
      - DomainVo
      - Infrastructure
      - InfrastructureComponent
      - InfrastructureDto
    DomainDto:
      - Domain
      - DomainContract
      - DomainDto
      - DomainEnum
      - DomainVo
    DomainSpecification:
      - Domain
      - DomainContract
      - DomainDto
      - DomainEnum
      - DomainSpecification
      - DomainVo

    # CQRS
    ApplicationCommand:
      - Application
      - ApplicationDto
      - ApplicationCommonDto
      - ApplicationEnum
    ApplicationQuery:
      - Application
      - ApplicationDto
      - ApplicationCommonDto
      - ApplicationEnum
    ApplicationCommandHandler:
      - Application
      - +ApplicationCommand
      - Domain
      - DomainDto
      - DomainEnum
      - DomainSpecification
      - DomainVo
      - DomainContract
    ApplicationQueryHandler:
      - Application
      - +ApplicationQuery
      - Domain
      - DomainDto
      - DomainEnum
      - DomainSpecification
      - DomainVo
      - DomainContract

    # Layer dependencies
    Presentation:
      - Application
      - +ApplicationCommand
      - +ApplicationQuery
      - ApplicationCommandHandler
      - ApplicationQueryHandler
    # Application (services, mappers, factories) works with DTO/Enum of its own layer and
    # with Domain value types. Entities are reached through handlers and repositories only.
    # No `+Layer` here: it is a transitive closure and would grant the handlers' dependencies.
    Application:
      - Application
      - ApplicationCommandHandler
      - ApplicationQueryHandler
      - ApplicationDto
      - ApplicationCommonDto
      - ApplicationEnum
      - DomainDto
      - DomainEnum
      - DomainVo
      - DomainSpecification
      - DomainContract
    Integration:
      - Integration
      - IntegrationDto
      - Application
      - DomainContract
      - ApplicationCommand
      - ApplicationQuery
      - ApplicationCommandHandler
      - ApplicationQueryHandler
      - ApplicationDto
      - ApplicationCommonDto
      - ApplicationEnum
      - Domain
      - DomainEmbeddable
      - DomainDto
      - DomainEnum
      - DomainVo
    Infrastructure:
      - Infrastructure
      - InfrastructureComponent
      - InfrastructureDto
      - InfrastructureEnum
      - Domain
      - DomainContract
      - DomainEmbeddable
      - DomainDto
      - DomainEnum
      - DomainVo
    InfrastructureEnum:
      - InfrastructureEnum
    InfrastructureComponent:
      - InfrastructureComponent
      - InfrastructureDto
    IntegrationListener:
      - IntegrationListener
      - Integration
      - IntegrationDto
      - Application
      - +ApplicationCommand
      - +ApplicationQuery
      - ApplicationCommandHandler
      - ApplicationQueryHandler

# Custom Deptrac event subscriber for service contract rules.
# Provided by prikotov/coding-standard — no need to copy, works out of the box.
# The rules honor deptrac `skip_violations`: EventHelper converts matched
# violations into SkippedViolation (the depfile `services:` section is loaded
# without container-wide autowire defaults, so the helper is wired explicitly).
services:
  - class: PrikotovCodingStandard\Deptrac\MetricsJsonOutputFormatter
    tags:
      - { name: output_formatter }
  - class: PrikotovCodingStandard\Deptrac\ServiceContractDependencyRule
    autowire: true
    tags:
      - { name: kernel.event_subscriber }
  - class: PrikotovCodingStandard\Deptrac\ReservedLayerSegmentRule
    autowire: true
    tags:
      - { name: kernel.event_subscriber }
  - class: PrikotovCodingStandard\Deptrac\CrossModuleDomainRule
    autowire: true
    tags:
      - { name: kernel.event_subscriber }
